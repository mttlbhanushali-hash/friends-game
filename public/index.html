<!DOCTYPE html>
<html>
<head>
<title>Friends Survival</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#222;
}

canvas{
  display:block;
  margin:auto;
  background:#5aa35a;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let myId;
let players = {};
const keys = {};

const WORLD_WIDTH = 3000;
const WORLD_HEIGHT = 3000;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const trees = [];
const coins = [];

for(let i=0;i<80;i++){
  trees.push({
    x: Math.random()*WORLD_WIDTH,
    y: Math.random()*WORLD_HEIGHT
  });
}

for(let i=0;i<50;i++){
  coins.push({
    x: Math.random()*WORLD_WIDTH,
    y: Math.random()*WORLD_HEIGHT
  });
}

window.addEventListener("keydown",(e)=>{
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",(e)=>{
  keys[e.key.toLowerCase()] = false;
});

socket.on("connect",()=>{
  myId = socket.id;
});

socket.on("state",(serverPlayers)=>{
  players = serverPlayers;
});

function update(){

  const me = players[myId];

  if(!me) return;

  if(me.coins === undefined){
    me.coins = 0;
  }

  const speed = 5;

  if(keys["w"]) me.y -= speed;
  if(keys["s"]) me.y += speed;
  if(keys["a"]) me.x -= speed;
  if(keys["d"]) me.x += speed;

  me.x = Math.max(0, Math.min(WORLD_WIDTH, me.x));
  me.y = Math.max(0, Math.min(WORLD_HEIGHT, me.y));

  for(let coin of coins){

    const dx = me.x - coin.x;
    const dy = me.y - coin.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < 30){
      me.coins++;
      coin.x = Math.random()*WORLD_WIDTH;
      coin.y = Math.random()*WORLD_HEIGHT;
    }
  }

  socket.emit("move", me);
}

function draw(){

  const me = players[myId];
  if(!me) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const camX = me.x - canvas.width/2;
  const camY = me.y - canvas.height/2;

  // ground
  ctx.fillStyle = "#5aa35a";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // trees
  for(let tree of trees){

    ctx.fillStyle = "#5b3a1a";
    ctx.fillRect(
      tree.x-camX-10,
      tree.y-camY,
      20,
      30
    );

    ctx.fillStyle = "green";
    ctx.fillRect(
      tree.x-camX-25,
      tree.y-camY-25,
      50,
      40
    );
  }

  // coins
  for(let coin of coins){
    ctx.fillStyle = "gold";

    ctx.beginPath();
    ctx.arc(
      coin.x-camX,
      coin.y-camY,
      10,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  // players
  for(let id in players){

    const p = players[id];

    const px = p.x - camX;
    const py = p.y - camY;

    // body
    ctx.fillStyle =
      id === myId ? "#4caf50" : "#ff5252";

    ctx.fillRect(px-12, py-12, 24, 24);

    // head
    ctx.fillStyle = "#f2c79b";
    ctx.fillRect(px-8, py-24, 16, 12);
  }

  // UI
  ctx.fillStyle = "white";
  ctx.font = "22px Arial";
  ctx.fillText(
    "Coins: " + me.coins,
    20,
    40
  );
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
