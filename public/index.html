<!DOCTYPE html>
<html>
<head>
<title>Friends Game</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
display:block;
margin:auto;
background:#111;
}
</style>
</head>

<body>

<canvas id="game" width="800" height="500"></canvas>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let myId;
let players = {};
const keys = {};

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

window.addEventListener("keydown",(e)=>{
keys[e.key]=true;
});

window.addEventListener("keyup",(e)=>{
keys[e.key]=false;
});

socket.on("connect",()=>{
myId=socket.id;
});

socket.on("state",(serverPlayers)=>{
players=serverPlayers;
});

function update(){

const me=players[myId];

if(me){

if(keys["w"]) me.y-=4;
if(keys["s"]) me.y+=4;
if(keys["a"]) me.x-=4;
if(keys["d"]) me.x+=4;

socket.emit("move",me);
}

}

function draw(){

ctx.clearRect(0,0,800,500);

for(let id in players){

const p=players[id];

ctx.fillStyle=id===myId ? "lime":"red";

ctx.fillRect(p.x,p.y,20,20);

}

}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
