<!DOCTYPE html>
<html>
<head>
<title>Friends Hub</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}

canvas{
  display:block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let myId;
let players = {};
const keys = {};

let mode = "hub"; // hub or survival
let fading = false;
let fadeAlpha = 0;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const WORLD = {
  width: 2000,
  height: 2000
};

// hub objects
const houses = [];
const trees = [];

for(let i=0;i<25;i++){
  houses.push({
    x: Math.random()*WORLD.width,
    y: Math.random()*WORLD.height
  });
}

for(let i=0;i<40;i++){
  trees.push({
    x: Math.random()*WORLD.width,
    y: Math.random()*WORLD.height
  });
}

window.addEventListener("keydown",(e)=>{
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",(e)=>{
  keys[e.key.toLowerCase()] = false;
});

socket.on("connect",()=>{
  myId = socket.id;
});

socket.on("state",(serverPlayers)=>{
  players = serverPlayers;
});

function update(){

  const me = players[myId];
  if(!me) return;

  if(me.coins === undefined) me.coins = 0;
  if(me.wood === undefined) me.wood = 0;

  const speed = 4;

  if(keys["w"]) me.y -= speed;
  if(keys["s"]) me.y += speed;
  if(keys["a"]) me.x -= speed;
  if(keys["d"]) me.x += speed;

  me.x = Math.max(0, Math.min(WORLD.width, me.x));
  me.y = Math.max(0, Math.min(WORLD.height, me.y));

  // ENTER SURVIVAL PORTAL (center area)
  const dx = me.x - WORLD.width/2;
  const dy = me.y - WORLD.height/2;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(mode === "hub" && dist < 120 && keys["e"] && !fading){
    startFadeToSurvival();
  }

  socket.emit("move", me);
}

function startFadeToSurvival(){
  fading = true;
  fadeAlpha = 0;

  const fade = setInterval(()=>{
    fadeAlpha += 0.05;

    if(fadeAlpha >= 1){
      clearInterval(fade);
      mode = "survival";
      fading = false;
    }
  },30);
}

function draw(){

  const me = players[myId];
  if(!me) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const camX = me.x - canvas.width/2;
  const camY = me.y - canvas.height/2;

  // background
  ctx.fillStyle = (mode === "hub") ? "#2c3e50" : "#3b7a3b";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(mode === "hub"){

    // HUB WORLD
    for(let h of houses){

      ctx.fillStyle = "#b58b5b";
      ctx.fillRect(h.x-camX, h.y-camY, 60, 60);

      ctx.fillStyle = "#6b4f2a";
      ctx.fillRect(h.x-camX+10, h.y-camY+20, 20, 20);
    }

    // center portal
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(WORLD.width/2 - camX, WORLD.height/2 - camY, 40, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("Press E to enter Survival", WORLD.width/2 - camX - 90, WORLD.height/2 - camY - 60);
  }

  if(mode === "survival"){

    // SURVIVAL TREES
    for(let t of trees){

      ctx.fillStyle = "#5b3a1a";
      ctx.fillRect(t.x-camX, t.y-camY, 20, 40);

      ctx.fillStyle = "green";
      ctx.fillRect(t.x-camX-20, t.y-camY-30, 60, 40);
    }
  }

  // PLAYERS
  for(let id in players){

    const p = players[id];

    const px = p.x - camX;
    const py = p.y - camY;

    ctx.fillStyle = (id === myId) ? "#4caf50" : "#ff5252";
    ctx.fillRect(px-12, py-12, 24, 24);

    ctx.fillStyle = "#f2c79b";
    ctx.fillRect(px-8, py-24, 16, 12);
  }

  // UI
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Mode: " + mode.toUpperCase(), 20, 40);

  ctx.fillText("WASD move", 20, 70);

  if(mode === "hub"){
    ctx.fillText("Go to blue portal + press E", 20, 100);
  }

  // fade
  if(fading){
    ctx.fillStyle = "black";
    ctx.globalAlpha = fadeAlpha;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha = 1;
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
